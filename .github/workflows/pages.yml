name: Publicar sistema SPFLY no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar pnpm
        run: npm install --global pnpm@11.19.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar banco e importação
        run: pnpm test
      - name: Compilar aplicação
        run: pnpm build --base=/spfly-kit-composicao/
        env:
          VITE_SUPABASE_URL: https://zhkxasnyqpccabaharas.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_N0OArv5CPljHFvszHtOgpw_xhiC-oLL
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
